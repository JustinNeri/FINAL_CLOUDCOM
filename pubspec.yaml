name: cloudcom_final
description: Simple monster detector demo
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  http: ^1.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  torch_light: ^1.1.0
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_logo.png
  min_sdk_android: 21